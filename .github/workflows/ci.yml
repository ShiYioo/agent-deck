name: CI

on:
  push:
    branches: [main]
    # 纯文档/提交信息改动不触发 CI
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:

# 同分支新推送取消还在跑的旧 CI（省排队和重复计算）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows-first 项目，CI 也在 Windows 上验证
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本由 package.json 的 packageManager 字段唯一决定（action v4 会自动读取）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tauri.conf.json 的 bundle.resources 引用 sidecar 产物，
      # 缺了它 cargo 的 tauri-build 会校验失败
      - name: Bundle sidecar
        run: pnpm bundle:sidecar

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Frontend typecheck & build
        run: pnpm build

      # 验证 Windows NSIS 安装器：包含自定义目录和当前用户/所有用户安装模式。
      - name: Build Windows NSIS installer
        run: pnpm tauri build --debug

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AgentDeck-windows-installer
          path: src-tauri/target/debug/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
